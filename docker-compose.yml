services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: streamflix-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "StreamFlix#2024"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - streamflix-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  streamflix-data:
