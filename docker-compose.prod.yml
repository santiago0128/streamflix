# Despliegue en servidor: base de datos + aplicación.
# Las contraseñas y secretos salen del archivo .env que vive junto a este
# fichero y que NO se versiona. Ver .env.example.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: streamflix-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?falta DB_PASSWORD en .env}"
      MSSQL_PID: "Developer"
      # Sin tope, SQL Server se queda con toda la RAM que encuentre y el resto
      # del servidor acaba en el OOM killer. Este limite es el del motor.
      MSSQL_MEMORY_LIMIT_MB: "${DB_MEMORY_LIMIT_MB:-1536}"
    # Y este es el techo duro del contenedor, contando el proceso entero.
    mem_limit: "${DB_MEM_LIMIT:-2g}"
    volumes:
      - streamflix-data:/var/opt/mssql
    # Sin "ports": la base solo se alcanza desde la red interna de Docker.
    # Exponer 1433 a internet es la forma más rápida de que te la revienten.
    expose:
      - "1433"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  app:
    build: .
    container_name: streamflix-app
    environment:
      DB_SERVER: sqlserver
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD:?falta DB_PASSWORD en .env}"
      DB_NAME: "${DB_NAME:-StreamFlix}"
      JWT_SECRET: "${JWT_SECRET:?falta JWT_SECRET en .env}"
      PORT: "3000"

      # Al contenedor de la app no se le monta el .env —solo al del bot—, así
      # que lo que no esté listado aquí no existe dentro por mucho que esté en
      # el fichero. Sin esto, el botón de donar no aparecía y los avisos de
      # solicitudes no se enviaban, en los dos casos sin dar ningún error.

      # Donaciones. El enlace de pago es público (no es un secreto), así que
      # viene con valor por defecto y el sitio funciona sin tocar el .env.
      MP_DONATION_LINK: "${MP_DONATION_LINK:-https://link.mercadopago.com.co/noxis}"
      # Solo si algún día se usa Checkout Pro en vez del enlace.
      MP_ACCESS_TOKEN: "${MP_ACCESS_TOKEN:-}"
      MP_CURRENCY: "${MP_CURRENCY:-}"
      MP_DONATION_PRESETS: "${MP_DONATION_PRESETS:-}"
      MP_MIN_AMOUNT: "${MP_MIN_AMOUNT:-}"
      MP_MAX_AMOUNT: "${MP_MAX_AMOUNT:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"

      # Avisos de solicitudes de contenido. Estos sí son secretos: salen del
      # .env y, si faltan, la solicitud se guarda igual y no se avisa.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"

      # Permite reconocer películas/series aunque se soliciten con el título
      # original en otro idioma. Sin clave sigue funcionando la comparación
      # local; el anime usa AniList y no necesita credenciales.
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
    # Los banners del carrusel los genera `generate-backdrops.js` dentro de este
    # contenedor. Sin montar la carpeta, se escribían en su capa efímera y la
    # siguiente reconstrucción se los llevaba, dejando en la base URLs de
    # /media/backdrops que ya no existían. Montada, quedan en el host, que es
    # además lo que el rsync del despliegue excluye a propósito.
    volumes:
      - ./media:/app/media
    # Solo escucha en localhost del host: el acceso público entra por el
    # proxy inverso (nginx/Caddy), que es quien pone HTTPS.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  # Bot de Telegram: avisa cuando termina una importación y permite lanzarlas
  # desde el móvil. Usa long polling, así que no expone ningún puerto ni
  # necesita dominio ni HTTPS.
  telegram:
    image: streamflix-bot
    container_name: streamflix-telegram
    command: telegram_bot.js
    environment:
      STREAMFLIX_ROOT: /streamflix
      JK_NO_BROWSER: "1"
      # Carpeta compartida: el importador deja aquí por dónde va, y el bot lo
      # lee para /estado y para avisar al terminar, aunque la carga la haya
      # lanzado el cron en otro contenedor.
      STREAMFLIX_PROGRESS_FILE: /estado/progreso.json
    volumes:
      - ./.env:/streamflix/.env:ro
      - /opt/streamflix/estado:/estado
    # Ollama corre en el host, fuera de Docker. Sin esta ruta el contenedor no
    # lo alcanza y /pide se queda sin motor cuando no hay clave de Anthropic.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    # El bot lanza importaciones, que son decenas de descargas: sin tope puede
    # competir por memoria con la base.
    mem_limit: 512m

  # Atiende la cola de solicitudes en segundo plano, de una en una y en cuanto
  # entran. Antes lo lanzaba un cron cada hora: una solicitud hecha justo
  # despues del turno esperaba casi una hora a que alguien la mirase, y la
  # gracia de pedir algo es tenerlo pronto. Como servicio, el retardo es el
  # intervalo de sondeo.
  #
  # Va en su propio contenedor y no dentro del bot de Telegram porque una
  # importacion son decenas de descargas de minutos: compartiendo proceso,
  # cualquier /pide se quedaba esperando a que terminara.
  solicitudes:
    image: streamflix-bot
    container_name: streamflix-solicitudes
    command: procesar_solicitudes.js --vigilar
    environment:
      STREAMFLIX_ROOT: /streamflix
      JK_NO_BROWSER: "1"
      STREAMFLIX_PROGRESS_FILE: /estado/progreso.json
      # El cerrojo que impide dos importaciones a la vez vive en TMPDIR. Apunta
      # al directorio compartido del host para que tambien lo vea una ejecucion
      # lanzada a mano desde fuera del contenedor.
      TMPDIR: /estado
      DB_SERVER: streamflix-sql
      DB_PORT: "1433"
    volumes:
      - ./.env:/streamflix/.env:ro
      - /opt/streamflix/estado:/estado
      # El codigo del bot se monta del host, igual que en los cron: asi un
      # cambio en el worker no obliga a reconstruir la imagen.
      - /opt/streamflix/jk-anime-launcher:/bot
    working_dir: /bot
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped
    # Una importacion en curso no puede morir por un apagado brusco: se le da
    # margen para cerrar y devolver la solicitud a la cola.
    stop_grace_period: 30s
    mem_limit: 1g

volumes:
  streamflix-data:
