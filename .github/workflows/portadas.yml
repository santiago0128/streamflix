name: Actualizar portadas del catálogo

# A mano cuando haga falta, y una vez al día por su cuenta.
#
# Lo diario nació de que una portada rota no avisa: nadie mira el catálogo
# entero, y el aviso llega cuando alguien abre una ficha y se encuentra el hueco.
# La pasada diaria usa --revisar: comprueba que cada imagen responda y que siga
# perteneciendo a la ficha correcta. Una portada equivocada de TMDB también da
# HTTP 200, por eso revisar solo disponibilidad no bastaba.
#
# Escribe en la base de producción, pero lo hace con red: no toca lo que ya
# funciona, comprueba la imagen nueva antes de guardarla, salta las fichas cuyo
# año no cuadra —que casi siempre son otra cosa con el mismo nombre— y deja el
# respaldo para deshacerlo.
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Escribir en la base. Sin marcar solo simula.'
        type: boolean
        default: false
      revisar:
        description: 'Comprobar disponibilidad e identidad de todas las portadas'
        type: boolean
        default: true
      tipos:
        description: 'Tipos de contenido (movie, series, anime)'
        type: string
        default: 'movie,series,anime'
      con_desfase_de_anio:
        description: 'Incluir las fichas cuyo año no cuadra (revisa antes la simulación)'
        type: boolean
        default: false
  schedule:
    - cron: '40 5 * * *'

# Dos ejecuciones a la vez sobre la misma base no acaban bien.
concurrency:
  group: portadas-servidor
  cancel-in-progress: false

jobs:
  portadas:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar acceso SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Ejecutar el script en el servidor
        env:
          EVENTO: ${{ github.event_name }}
          APLICAR: ${{ inputs.aplicar }}
          REVISAR: ${{ inputs.revisar }}
          TIPOS: ${{ inputs.tipos }}
          CON_DESFASE: ${{ inputs.con_desfase_de_anio }}
        run: |
          set -euo pipefail

          # En la pasada diaria no hay nadie leyendo un informe, así que simular
          # no serviría de nada: repara y revisa siempre. A mano manda lo que se
          # haya marcado, y por defecto solo simula.
          if [ "$EVENTO" = "schedule" ]; then
            APLICAR=true
            REVISAR=true
            TIPOS="movie,series,anime"
            CON_DESFASE=false
          fi

          # --respaldo solo tiene sentido escribiendo; en simulación no hay nada
          # que revertir. El fichero se deja fechado en el servidor.
          OPCIONES="--type=${TIPOS:-movie,series,anime}"
          if [ "${REVISAR:-true}" = "true" ]; then
            OPCIONES="$OPCIONES --revisar"
          fi
          if [ "${APLICAR:-false}" = "true" ]; then
            OPCIONES="$OPCIONES --apply --respaldo=/tmp/portadas-respaldo.sql"
          fi
          if [ "${CON_DESFASE:-false}" = "true" ]; then
            OPCIONES="$OPCIONES --con-desfase-de-ano"
          fi

          echo "Opciones: $OPCIONES"

          # -T porque no hay terminal: sin él, docker compose exec falla aquí.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/streamflix/streamflix && \
             docker compose -f docker-compose.prod.yml exec -T app \
               node server/db/update-posters.js $OPCIONES"

      - name: Recoger el respaldo
        # Aunque el paso anterior falle: si se cortó a mitad, el respaldo es
        # justamente lo que hace falta para deshacer lo que sí llegó a escribirse.
        if: ${{ always() && (inputs.aplicar || github.event_name == 'schedule') }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/streamflix/streamflix && \
             docker compose -f docker-compose.prod.yml exec -T app \
               sh -c 'cat /tmp/portadas-respaldo.sql 2>/dev/null || true'" > respaldo-portadas.sql
          echo "Líneas de vuelta atrás: $(grep -c '^UPDATE' respaldo-portadas.sql || echo 0)"

      - name: Guardar el respaldo como artefacto
        if: ${{ always() && (inputs.aplicar || github.event_name == 'schedule') }}
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-portadas
          path: respaldo-portadas.sql
          if-no-files-found: warn
          retention-days: 90
