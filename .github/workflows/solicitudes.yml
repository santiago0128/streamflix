name: Atender solicitudes de contenido

# A mano: cada ejecución lanza importaciones reales en el servidor.
#
# Para que la cola se atienda sola hay dos caminos. El barato es un cron en el
# servidor (ver deploy/README). El otro es descomentar el bloque schedule de
# aquí abajo, que no necesita tocar el servidor pero consume minutos de Actions:
# cada cuarto de hora son ~2.900 minutos al mes, por encima del plan gratuito de
# un repositorio privado. Cada dos horas se queda en ~360.
on:
  workflow_dispatch:
    inputs:
      simular:
        description: 'Solo mirar la cola, sin importar nada'
        type: boolean
        default: false
      max:
        description: 'Cuántas atender como mucho (vacío = todas)'
        type: string
        default: ''
  # schedule:
  #   - cron: '0 */2 * * *'

# Dos ejecuciones a la vez sobre el mismo servidor no acaban bien. El worker
# tiene su propio cerrojo, pero mejor no llegar a depender de él.
concurrency:
  group: solicitudes-servidor
  cancel-in-progress: false

jobs:
  solicitudes:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar acceso SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Actualizar el bot en el servidor
        # El bot vive en su propio repositorio y el despliegue de la web no lo
        # toca, así que sin este paso el servidor correría una versión vieja —o
        # ninguna, si el worker aún no ha llegado allí.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s <<'REMOTO'
          set -euo pipefail
          cd /opt/streamflix/jk-anime-launcher

          if git rev-parse --git-dir >/dev/null 2>&1; then
            git pull --ff-only
          else
            echo "-----------------------------------------------------------"
            echo "/opt/streamflix/jk-anime-launcher no es un clon de git, así"
            echo "que no puedo actualizarlo desde aquí. Opciones:"
            echo "  · clonarlo:  git clone git@github.com:santiago0128/jk-anime-launcher.git"
            echo "  · o copiar procesar_solicitudes.js a mano y relanzar esto."
            echo "-----------------------------------------------------------"
            exit 1
          fi

          # El worker no añade dependencias nuevas, pero un git pull sí puede
          # traerlas; si el lock cambió, se instalan.
          if ! git diff --quiet HEAD@{1} HEAD -- package-lock.json 2>/dev/null; then
            echo "package-lock.json cambió: reinstalando dependencias"
            npm ci --omit=dev
          fi
          REMOTO

      - name: Atender la cola
        env:
          SIMULAR: ${{ inputs.simular }}
          MAX: ${{ inputs.max }}
        run: |
          set -euo pipefail

          OPCIONES=""
          if [ "${SIMULAR:-false}" = "true" ]; then
            OPCIONES="$OPCIONES --dry-run"
          fi
          if [ -n "${MAX:-}" ]; then
            OPCIONES="$OPCIONES --max=$MAX"
          fi

          echo "Opciones: ${OPCIONES:-(ninguna: atiende la cola entera)}"

          # JK_NO_BROWSER porque en un servidor no hay navegador que abrir.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/streamflix/jk-anime-launcher && \
             STREAMFLIX_ROOT=/opt/streamflix/streamflix JK_NO_BROWSER=1 \
             node procesar_solicitudes.js $OPCIONES"
