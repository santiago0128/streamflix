name: Atender solicitudes de contenido

# A mano. Lo automático lo lleva el cron del servidor.
#
# Aquí había un `schedule` horario que en la práctica no atendió nunca nada: el
# paso de actualizar el bot moría (el directorio del servidor no es un clon de
# git) y, aunque hubiera seguido, esto lanzaba el worker con el `node` del host
# —la v12— y el driver de SQL Server no arranca ahí. Los otros dos trabajos del
# servidor funcionan porque van dentro de la imagen del bot, no con el node del
# host, y ahora esto también.
#
# Con el cron de /opt/streamflix/procesar_solicitudes.sh (:35 cada hora, junto a
# vigilar_emision y auto_fix_links), programarlo también aquí solo añade una
# segunda vuelta a la misma cola desde otro sitio. Se queda el disparo manual,
# que es para lo que sirve de verdad: atenderla ya, sin entrar al servidor, y
# poder simular antes.
on:
  workflow_dispatch:
    inputs:
      simular:
        description: 'Solo mirar la cola, sin importar nada'
        type: boolean
        default: false
      max:
        description: 'Cuántas atender como mucho (vacío = todas)'
        type: string
        default: ''

# Dos ejecuciones a la vez sobre el mismo servidor no acaban bien. El worker
# tiene su propio cerrojo, pero mejor no llegar a depender de él.
concurrency:
  group: solicitudes-servidor
  cancel-in-progress: false

jobs:
  solicitudes:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar acceso SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Actualizar el bot en el servidor
        # El bot vive en su propio repositorio y el despliegue de la web no lo
        # toca, así que sin este paso el servidor correría una versión vieja —o
        # ninguna, si el worker aún no ha llegado allí.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s <<'REMOTO'
          set -euo pipefail
          cd /opt/streamflix/jk-anime-launcher

          if git rev-parse --git-dir >/dev/null 2>&1; then
            # Un fallo aquí no puede tumbar el trabajo: con `set -e`, un
            # `git pull` que no avanza —un fichero tocado a mano en el
            # servidor, una rama divergida— acababa con el paso entero, y como
            # el de atender la cola va después, dejaba de atenderse. La cola
            # parada no avisa: las solicitudes se quedan en 'pendiente' y
            # parece que nadie las pidió. Sin poder actualizar se trabaja con
            # la versión que haya, que es mejor que no trabajar.
            if ! git pull --ff-only; then
              echo "::warning::No pude actualizar el bot (¿cambios locales o rama divergida en el servidor?). Sigo con la versión instalada."
            fi
          else
            # Tampoco aquí se aborta. Este `exit 1` tenía sentido cuando el
            # worker aún no estaba en el servidor, pero con el bot ya instalado
            # convertía "no puedo actualizar" en "no atiendo nada": el paso
            # moría, el de la cola no llegaba a ejecutarse y las solicitudes se
            # quedaban en 'pendiente' para siempre sin que nadie se enterara.
            echo "::warning::/opt/streamflix/jk-anime-launcher no es un clon de git: no puedo actualizarlo. Atiendo la cola con la versión instalada."
            echo "Para que vuelva a actualizarse solo:"
            echo "  git clone git@github.com:santiago0128/jk-anime-launcher.git"
          fi

          # El worker no añade dependencias nuevas, pero un git pull sí puede
          # traerlas; si el lock cambió, se instalan.
          if ! git diff --quiet HEAD@{1} HEAD -- package-lock.json 2>/dev/null; then
            echo "package-lock.json cambió: reinstalando dependencias"
            npm ci --omit=dev
          fi
          REMOTO

      - name: Atender la cola
        env:
          SIMULAR: ${{ inputs.simular }}
          MAX: ${{ inputs.max }}
        run: |
          set -euo pipefail

          OPCIONES=""
          if [ "${SIMULAR:-false}" = "true" ]; then
            OPCIONES="$OPCIONES --dry-run"
          fi
          if [ -n "${MAX:-}" ]; then
            OPCIONES="$OPCIONES --max=$MAX"
          fi

          echo "Opciones: ${OPCIONES:-(ninguna: atiende la cola entera)}"

          # Dentro de la imagen del bot, igual que los cron de vigilar_emision y
          # auto_fix_links. Antes se ejecutaba con el `node` del host y no
          # llegaba a arrancar: una sesión SSH no interactiva coge
          # /usr/bin/node, que aquí es la v12, y el driver de SQL Server usa
          # `??`, que es de la v14 para arriba. El worker moría con un
          # SyntaxError antes de leer la cola, así que ninguna solicitud se
          # atendió nunca. El node bueno está en nvm, pero eso solo lo ve una
          # shell de login: el contenedor no depende de con qué shell se entre.
          #
          # TMPDIR apunta a un directorio del host porque ahí vive el cerrojo
          # que impide dos importaciones a la vez. En el /tmp del contenedor,
          # que nace y muere con él, no protegería de nada.
          #
          # JK_NO_BROWSER porque en un servidor no hay navegador que abrir.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "docker run --rm --network streamflix_default \
               --add-host host.docker.internal:host-gateway \
               -v /opt/streamflix/jk-anime-launcher:/bot \
               -v /opt/streamflix/streamflix/.env:/streamflix/.env:ro \
               -v /opt/streamflix/estado:/estado \
               -e STREAMFLIX_ROOT=/streamflix \
               -e STREAMFLIX_PROGRESS_FILE=/estado/progreso.json \
               -e TMPDIR=/estado \
               -e DB_SERVER=streamflix-sql -e DB_PORT=1433 \
               -e JK_NO_BROWSER=1 \
               -w /bot streamflix-bot procesar_solicitudes.js $OPCIONES"
