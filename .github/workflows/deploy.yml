name: Desplegar en el servidor

on:
  push:
    branches: [main]
    # Cambios que no llegan al servidor no justifican un despliegue.
    paths-ignore:
      - '**.md'
      - 'deploy/**'
  workflow_dispatch:

# Dos push seguidos no deben desplegar a la vez sobre el mismo servidor.
concurrency:
  group: despliegue-servidor
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar acceso SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Clave del servidor fijada: evita aceptar a ciegas a quien conteste.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Enviar el código al servidor
        # Es Actions quien empuja el código, no el servidor quien lo baja: así
        # el repositorio puede ser privado sin dar credenciales de GitHub al
        # servidor. --delete deja el destino idéntico al repositorio, y lo
        # excluido (.env con los secretos) queda intacto.
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o BatchMode=yes" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'media' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/streamflix/streamflix/

      - name: Reconstruir y comprobar
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "/opt/streamflix/deploy.sh streamflix"

      # Una tabla nueva en schema.sql se quedaba sin crear hasta que alguien
      # entraba al servidor a mano, y mientras tanto la función que la usa
      # fallaba en producción sin más aviso. Se puede correr en cada despliegue
      # porque schema.sql es idempotente y seed.sql está envuelto en un
      # IF NOT EXISTS sobre dbo.Series: con catálogo cargado no hace nada.
      - name: Aplicar el esquema de la base
        run: |
          set -euo pipefail
          for intento in 1 2 3 4 5; do
            if ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
                 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
                 "cd /opt/streamflix/streamflix && \
                  docker compose -f docker-compose.prod.yml exec -T app node server/db/init.js"
            then
              exit 0
            fi
            # El contenedor puede estar aún reiniciándose tras la reconstrucción.
            echo "Intento $intento fallido; reintento en 10 s."
            sleep 10
          done
          echo "No se pudo aplicar el esquema tras 5 intentos."
          exit 1
